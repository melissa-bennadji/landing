<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Maison Mélissa - Parfums de niche</title>
    <link rel="stylesheet" href="css/style.css">
  </head>

  <body>
    <!-- Bannière -->
    <div class="banner">
      <div class="container">
        <h1>Des parfums qui racontent une histoire</h1>
        <h2>Une maison de parfums de niche, entre la France et l'Italie.</h2>
        <a href="#rejoindre" class="btn-blue">Découvrir la collection</a>
      </div>
    </div>

    <!-- Grille de cartes -->
    <div class="container">
      <h2>Nos familles olfactives</h2>
      <div class="cards">
        <div class="card">
          <img src="images/floral.jpg" alt="Famille florale">
          <h3>Floral</h3>
        </div>
        <div class="card">
          <img src="images/boise.jpg" alt="Famille boisée">
          <h3>Boisé</h3>
        </div>
        <div class="card">
          <img src="images/oriental.jpg" alt="Famille orientale">
          <h3>Oriental</h3>
        </div>
        <div class="card">
          <img src="images/agrumes.jpg" alt="Famille hespéridée">
          <h3>Agrumes</h3>
        </div>
        <div class="card">
          <img src="images/gourmand.jpg" alt="Famille gourmande">
          <h3>Gourmand</h3>
        </div>
      </div>
    </div>

    <!-- Formulaire Typeform -->
    <div class="container form-section" id="rejoindre">
      <h2>Rejoins la liste d'attente</h2>
      <p>Sois la première personne informée du lancement de nos parfums.</p>
      <div class="form-box">
        <div data-tf-live="01M70EG7THZ8ZBA9JM4Z09014W"></div><script src="https://embed.typeform.com/next/embed.js"></script>
      </div>
    </div>
  </body>
</html>
